---
# domains and ports
entry_domain: entry.example.com
exit_domain: exit.example.com
entry_awg_port: 51820
exit_awg_port: 51821
ssh_port: 22
extra_input_tcp_ports: []

# addressing and image
entry_awg_subnet: 10.8.1.0/24
uplink_subnet: 10.9.0.0/30
uplink_mtu: 1280
awg_base_image_digest: sha256:cbafc02b8373a83f428272db6d8001b37bc02e6211cbd8c0cb4e2e3759b12b72
# ghcr.io/xtls/xray-core release 26.10.31 (multi-arch OCI index digest)
xray_image_digest: sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9

# uplink transport: awg (default) or reality (TPROXY into Xray, VLESS + REALITY
# to the exit; needs vault_link_reality and reality_uuid, see the README)
# uplink_transport: reality
# exit_reality_port: 443
# uplink_reality_site: dl.google.com
# uplink_tproxy_port: 12345   # loopback only; not entry_xray_port, not SSH

# the app's Xray server on the entry (needs vault_entry_xray)
# entry_xray_enabled: true
# entry_xray_port: 443        # cannot change after the first deploy
# entry_xray_site: www.googletagmanager.com

# split routing
split_routing_enabled: true
split_direct_countries: [ru]
split_country_list_url: "https://www.ipdeny.com/ipblocks/data/aggregated/{cc}-aggregated.zone"
split_direct_cidrs: []
split_direct_domains: []
split_force_exit_cidrs: []

# backups
backup_s3_endpoint: https://s3.example.com
backup_s3_region: CHANGE_ME
backup_s3_bucket: CHANGE_ME
backup_s3_prefix: multihop
backup_interval: 15min
backup_age_recipient: age1CHANGE_ME

# DNS
dns_backend: manual
