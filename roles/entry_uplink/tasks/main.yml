---
- name: Check REALITY vault values
  when: uplink_transport == 'reality'
  block:
    - name: Check vault_link_reality
      ansible.builtin.include_tasks: ../../common/tasks/assert-vault.yml
      vars:
        assert_vault_var: vault_link_reality
        assert_vault_keys: [private_key, public_key, short_id]
        assert_vault_hint: uv run scripts/gen-secrets.py xray

    - name: Check vault_uplink_entry reality_uuid
      ansible.builtin.include_tasks: ../../common/tasks/assert-vault.yml
      vars:
        assert_vault_var: vault_uplink_entry
        assert_vault_keys: [reality_uuid]
        # Rotating also changes the AWG uplink key: deploy the exit, then the entry.
        assert_vault_hint: uv run scripts/gen-secrets.py uplink-key > <inventory>/group_vars/all/vault_uplink.yml

# The bridges' subnets, which multihop-entry-net keeps out of TPROXY in
# reality mode. entry_app creates the app network after this role on a first
# deploy, so until then its configured subnet stands in.
- name: Read the bridges' docker networks
  community.docker.docker_network_info:
    name: "{{ item }}"
  loop:
    - bridge
    - "{{ entry_app_network }}"
  register: entry_uplink_networks

- name: Collect the bridges' IPv4 subnets
  ansible.builtin.set_fact:
    entry_uplink_local_nets: >-
      {{ (entry_uplink_networks.results
          | selectattr('exists')
          | map(attribute='network.IPAM.Config', default=[]) | reject('none') | flatten
          | map(attribute='Subnet') | reject('search', ':') | list
         + ([] if (entry_uplink_networks.results[1].exists) else [entry_app_network_subnet]))
         | unique }}

# Own marker so the common block in multihop.env survives re-runs.
- name: Write uplink keys to multihop.env
  ansible.builtin.blockinfile:
    path: /etc/multihop/multihop.env
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED BLOCK uplink"
    block: |
      ENTRY_AWG_PORT={{ entry_awg_port }}
      BRIDGES="{{ entry_uplink_bridges | join(' ') }}"
      EXIT_DOMAIN={{ exit_domain }}
      EXIT_PORT={{ exit_awg_port }}
      EXIT_PUBKEY={{ vault_link_awg.exit_public_key }}
      UPLINK_TRANSPORT={{ uplink_transport }}
      UPLINK_TPROXY_PORT={{ uplink_tproxy_port }}
      ENTRY_LOCAL_NETS="{{ entry_uplink_local_nets | join(' ') }}"
      ENTRY_XRAY_PORT={{ entry_xray_port if entry_xray_enabled | bool else '' }}
      UPLINK_STATE_DIR={{ entry_uplink_state_dir }}
  register: entry_uplink_env
  notify: Reload multihop-net

- name: Install multihop scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/sbin/{{ item }}"
    mode: "0755"
    owner: root
    group: root
  loop:
    - multihop-entry-net
    - multihop-reresolve
  notify: Reload multihop-net

- name: Install multihop-net unit
  ansible.builtin.template:
    src: multihop-net.service.j2
    dest: /etc/systemd/system/multihop-net.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Reload multihop-net

- name: Keep the public interface's group across NIC renames and re-creation
  ansible.builtin.template:
    src: 90-multihop-public-group.rules.j2
    dest: /etc/udev/rules.d/90-multihop-public-group.rules
    mode: "0644"
    owner: root
    group: root

- name: Create docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

# Docker pulls in multihop-net and starts after it, so a Docker restart or a
# reboot never runs amnezia-awg2 without the routing and firewall rules.
- name: Order docker.service after multihop-net
  ansible.builtin.copy:
    src: docker-multihop.conf
    dest: /etc/systemd/system/docker.service.d/multihop.conf
    mode: "0644"
    owner: root
    group: root
  notify: Reload systemd

- name: Install re-resolve units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
    owner: root
    group: root
  loop:
    - multihop-reresolve.service
    - multihop-reresolve.timer
  notify: Reload systemd

- name: Create uplink state directory
  ansible.builtin.file:
    path: "{{ entry_uplink_state_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Write awg-uplink.conf
  ansible.builtin.template:
    src: awg-uplink.conf.j2
    dest: "{{ entry_uplink_state_dir }}/awg-uplink.conf"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart multihop-uplink

- name: Write xray-uplink.json
  ansible.builtin.template:
    src: xray-uplink.json.j2
    dest: "{{ entry_uplink_state_dir }}/xray-uplink.json"
    mode: "0600"
    owner: root
    group: root
  when: uplink_transport == 'reality'
  no_log: true
  notify: Restart multihop-uplink-xray

- name: Remove xray-uplink.json outside reality mode
  ansible.builtin.file:
    path: "{{ entry_uplink_state_dir }}/xray-uplink.json"
    state: absent
  when: uplink_transport != 'reality'

- name: Write uplink-start.sh
  ansible.builtin.template:
    src: uplink-start.sh.j2
    dest: "{{ entry_uplink_state_dir }}/uplink-start.sh"
    mode: "0755"
    owner: root
    group: root
  notify: Restart multihop-uplink

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# In reality mode the AWG uplink goes first: its `default dev awg-uplink` and
# the `local default dev lo` of table 51820 share one route key, so it must be
# gone before multihop-net installs the reality rules.
- name: Remove multihop-uplink in reality mode
  community.docker.docker_container:
    name: multihop-uplink
    state: absent
  when: uplink_transport == 'reality'

# Rules first, then the container that adds the uplink route. Handlers
# (container restart included) run at the end of the play.
- name: Enable and start multihop-net
  ansible.builtin.systemd_service:
    name: multihop-net
    enabled: true
    state: started

# A mode switch must apply its rules before the uplink container starts: the
# awg-mode rules delete the local route that blocks `default dev awg-uplink`.
# The handler would only reload after the containers.
- name: Apply changed uplink mode to multihop-net now
  ansible.builtin.systemd_service:
    name: multihop-net
    state: reloaded
  when: entry_uplink_env.changed  # noqa: no-handler

- name: Run multihop-uplink container
  community.docker.docker_container:
    name: multihop-uplink
    image: "{{ entry_uplink_image }}"
    state: started
    restart_policy: always
    network_mode: host
    capabilities:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun:rwm
    entrypoint:
      - bash
      - /opt/multihop/uplink-start.sh
    env:
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
    volumes:
      - "{{ entry_uplink_state_dir }}/awg-uplink.conf:/etc/amnezia/awg-uplink.conf:ro"
      - "{{ entry_uplink_state_dir }}/uplink-start.sh:/opt/multihop/uplink-start.sh:ro"
  when: uplink_transport != 'reality'

- name: Run multihop-uplink-xray container
  community.docker.docker_container:
    name: multihop-uplink-xray
    image: "{{ common_xray_image_tag }}"
    state: "{{ 'started' if uplink_transport == 'reality' else 'absent' }}"
    restart_policy: always
    network_mode: host
    user: "0:0"
    capabilities:
      - NET_ADMIN
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - "{{ entry_uplink_state_dir }}/xray-uplink.json:/etc/xray/config.json:ro"

- name: Enable and start re-resolve timer
  ansible.builtin.systemd_service:
    name: multihop-reresolve.timer
    enabled: true
    state: started

# Apply changed rules (reload multihop-net) and uplink config now, before
# entry_app converges amnezia-awg2. Also keeps the notification if a later
# role fails: Ansible drops pending handlers of a failed play, and the next
# run would see no change and never reload.
- name: Apply uplink changes before the app is converged
  ansible.builtin.meta: flush_handlers
