---
- name: Check REALITY vault values
  when: uplink_transport == 'reality'
  block:
    - name: Check vault_link_reality
      ansible.builtin.include_tasks: ../../common/tasks/assert-vault.yml
      vars:
        assert_vault_var: vault_link_reality
        assert_vault_keys: [private_key, public_key, short_id]
        assert_vault_hint: uv run scripts/gen-secrets.py xray

    - name: Check vault_uplink_entry reality_uuid
      ansible.builtin.include_tasks: ../../common/tasks/assert-vault.yml
      vars:
        assert_vault_var: vault_uplink_entry
        assert_vault_keys: [reality_uuid]
        # Rotating also changes the AWG uplink key: deploy the exit, then the entry.
        assert_vault_hint: uv run scripts/gen-secrets.py uplink-key > <inventory>/group_vars/all/vault_uplink.yml

# Own marker so the common block in multihop.env survives re-runs.
- name: Write exit keys to multihop.env
  ansible.builtin.blockinfile:
    path: /etc/multihop/multihop.env
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED BLOCK exit"
    block: |
      UPLINK_SUBNET={{ uplink_subnet }}
  notify: Reload multihop-net

- name: Install multihop-exit-net
  ansible.builtin.copy:
    src: multihop-exit-net
    dest: /usr/local/sbin/multihop-exit-net
    mode: "0755"
    owner: root
    group: root
  notify: Reload multihop-net

- name: Install multihop-net unit
  ansible.builtin.template:
    src: multihop-net.service.j2
    dest: /etc/systemd/system/multihop-net.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Reload multihop-net

- name: Create docker.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Start multihop-net whenever Docker starts
  ansible.builtin.copy:
    src: docker-multihop.conf
    dest: /etc/systemd/system/docker.service.d/multihop.conf
    mode: "0644"
    owner: root
    group: root
  notify: Reload systemd

- name: Create exit state directory
  ansible.builtin.file:
    path: "{{ exit_state_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: Write awg-exit.conf
  ansible.builtin.template:
    src: awg-exit.conf.j2
    dest: "{{ exit_state_dir }}/awg-exit.conf"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart multihop-exit

- name: Write exit-start.sh
  ansible.builtin.template:
    src: exit-start.sh.j2
    dest: "{{ exit_state_dir }}/exit-start.sh"
    mode: "0755"
    owner: root
    group: root
  notify: Restart multihop-exit

- name: Write xray-exit.json
  ansible.builtin.template:
    src: xray-exit.json.j2
    dest: "{{ exit_state_dir }}/xray-exit.json"
    mode: "0600"
    owner: root
    group: root
  when: uplink_transport == 'reality'
  no_log: true
  notify: Restart multihop-exit-xray

- name: Remove xray-exit.json outside reality mode
  ansible.builtin.file:
    path: "{{ exit_state_dir }}/xray-exit.json"
    state: absent
  when: uplink_transport != 'reality'

- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Handlers (container restart included) run at the end of the play, after the
# container exists, so a first run never restarts a missing container.
- name: Enable and start multihop-net
  ansible.builtin.systemd_service:
    name: multihop-net
    enabled: true
    state: started

- name: Run multihop-exit container
  community.docker.docker_container:
    name: multihop-exit
    image: "{{ exit_image }}"
    state: started
    restart_policy: always
    network_mode: host
    capabilities:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun:rwm
    entrypoint:
      - bash
      - /opt/multihop/exit-start.sh
    env:
      WG_QUICK_USERSPACE_IMPLEMENTATION: amneziawg-go
    volumes:
      - "{{ exit_state_dir }}/awg-exit.conf:/etc/amnezia/awg-exit.conf:ro"
      - "{{ exit_state_dir }}/exit-start.sh:/opt/multihop/exit-start.sh:ro"

- name: Run multihop-exit-xray container
  community.docker.docker_container:
    name: multihop-exit-xray
    image: "{{ common_xray_image_tag }}"
    state: "{{ 'started' if uplink_transport == 'reality' else 'absent' }}"
    restart_policy: always
    network_mode: host
    user: "0:0"
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - "{{ exit_state_dir }}/xray-exit.json:/etc/xray/config.json:ro"
