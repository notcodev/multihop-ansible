---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload multihop-net
  ansible.builtin.systemd_service:
    name: multihop-net
    state: reloaded

- name: Restart multihop-exit
  community.docker.docker_container:
    name: multihop-exit
    restart: true

- name: Restart multihop-exit-xray
  community.docker.docker_container:
    name: multihop-exit-xray
    restart: true
