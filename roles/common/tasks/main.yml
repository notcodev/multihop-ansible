---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Enable and start docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Load tcp_bbr
  community.general.modprobe:
    name: tcp_bbr
    state: present

- name: Load tcp_bbr on boot
  ansible.builtin.copy:
    content: "tcp_bbr\n"
    dest: /etc/modules-load.d/multihop-bbr.conf
    mode: "0644"
    owner: root
    group: root

- name: Set sysctls
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-multihop.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: net.ipv4.ip_forward, value: "1" }
    - { key: net.ipv4.conf.all.src_valid_mark, value: "1" }
    - { key: net.ipv6.conf.all.forwarding, value: "0" }
    # Loose reverse-path filtering: on the entry, replies arriving on
    # awg-uplink for the app container fail a strict check (the main table
    # routes their source via the public interface) and are dropped silently.
    - { key: net.ipv4.conf.all.rp_filter, value: "2" }
    - { key: net.ipv4.conf.default.rp_filter, value: "2" }
    - { key: net.core.default_qdisc, value: fq }
    - { key: net.ipv4.tcp_congestion_control, value: bbr }

- name: Create multihop config directory
  ansible.builtin.file:
    path: /etc/multihop
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Create multihop state directory
  ansible.builtin.file:
    path: /var/lib/multihop
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Read applied base image digest marker
  ansible.builtin.slurp:
    src: /var/lib/multihop/awg-base.digest
  register: common_applied_digest
  failed_when: false

- name: Inspect pinned base image tag
  community.docker.docker_image_info:
    name: "{{ common_base_image_tag }}"
  register: common_pinned_image

- name: Pull, tag and untag pinned base image
  when: >-
    (common_pinned_image.images | length == 0)
    or (common_applied_digest.content | default('') | b64decode | trim) != awg_base_image_digest
  block:
    - name: Pull pinned base image by digest
      community.docker.docker_image:
        name: "{{ common_base_image }}@{{ awg_base_image_digest }}"
        source: pull

    - name: Tag base image locally
      community.docker.docker_image_tag:
        name: "{{ common_base_image }}@{{ awg_base_image_digest }}"
        repository: "{{ common_base_image_tag }}"
        existing_images: overwrite

    # Keep `docker images` free of the upstream name; only the digest
    # reference is removed, the multihop tag stays. `docker rmi` because the
    # community.docker modules rewrite repo@digest into an invalid repo:digest.
    - name: Remove upstream reference (untag only)
      ansible.builtin.command:
        argv: [docker, rmi, "{{ common_base_image }}@{{ awg_base_image_digest }}"]
      register: common_untag
      changed_when: "'Untagged' in common_untag.stdout"
      failed_when: common_untag.rc != 0 and 'No such image' not in common_untag.stderr

    - name: Record applied base image digest
      ansible.builtin.copy:
        content: "{{ awg_base_image_digest }}\n"
        dest: /var/lib/multihop/awg-base.digest
        mode: "0644"
        owner: root
        group: root

- name: Pin Xray image
  ansible.builtin.include_tasks: xray-image.yml
  when: uplink_transport == 'reality'

# Own marker so blocks appended by later roles survive re-runs.
- name: Write common keys to multihop.env
  ansible.builtin.blockinfile:
    path: /etc/multihop/multihop.env
    create: true
    mode: "0644"
    owner: root
    group: root
    marker: "# {mark} ANSIBLE MANAGED BLOCK common"
    block: "{{ lookup('ansible.builtin.template', 'multihop.env.j2') }}"
  notify: Reload multihop-input-fw

- name: Install multihop-input-fw
  ansible.builtin.copy:
    src: multihop-input-fw
    dest: /usr/local/sbin/multihop-input-fw
    mode: "0755"
    owner: root
    group: root
  notify: Reload multihop-input-fw

- name: Install multihop-input-fw unit
  ansible.builtin.template:
    src: multihop-input-fw.service.j2
    dest: /etc/systemd/system/multihop-input-fw.service
    mode: "0644"
    owner: root
    group: root
  notify:
    - Reload systemd
    - Reload multihop-input-fw

- name: Flush handlers before enabling firewall
  ansible.builtin.meta: flush_handlers

- name: Enable and start multihop-input-fw
  ansible.builtin.systemd_service:
    name: multihop-input-fw
    enabled: true
    state: started
