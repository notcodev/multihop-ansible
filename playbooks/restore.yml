---
# Replace the entry's user state (awg0.conf, keys, clientsTable, and with
# entry_xray_enabled the Xray state under the backup's xray/) with a backup.
#   ansible-playbook playbooks/restore.yml [-e backup_object=entry-<ts>.tar.age] [-e confirm=yes]
#     [-e restore_skip_xray=true]   AWG only: ignore the backup's xray/ (e.g. refused)
# Also the recovery path when the app re-installed amnezia-awg2 or
# amnezia-xray without the bind mount. Users added after that backup are lost.
- name: Confirm the restore
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Ask for confirmation
      ansible.builtin.pause:
        prompt: >-
          This REPLACES all user state on the entry with backup
          '{{ backup_object | default('latest', true) }}'. Users added after that backup
          are lost. Type 'yes' to continue
      register: restore_confirm
      when: confirm | default('') != 'yes'

    - name: Stop unless confirmed
      ansible.builtin.assert:
        that: restore_confirm.user_input | default('') | trim == 'yes'
        fail_msg: "Restore cancelled"
        quiet: true
      when: confirm | default('') != 'yes'

- name: Restore the entry state from backup
  hosts: entry
  become: true
  # entry_xray_enabled / entry_xray_port (fetch-backup.yml, entry_xray).
  roles:
    - multihop_defaults
  tasks:
    - name: Restore
      block:
        - name: Restore needs exactly one entry host
          ansible.builtin.assert:
            that: ansible_play_hosts_all | length == 1
            fail_msg: "The entry group must contain exactly one host"

        - name: Fetch, decrypt and validate the backup on the controller
          ansible.builtin.include_tasks: tasks/fetch-backup.yml

        # public: entry_xray below reads entry_app's defaults (entry_app_network).
        - name: Apply entry_app with the backup
          ansible.builtin.include_role:
            name: entry_app
            public: true

        # A backup without xray/ leaves the Xray state as it is (or seeds it);
        # fetch-backup.yml printed a notice. -e restore_skip_xray=true (a
        # refused xray/) leaves amnezia-xray and its state untouched.
        - name: Apply entry_xray with the backup
          ansible.builtin.include_role:
            name: entry_xray
          vars:
            entry_xray_restore_dir: "{{ entry_restore_xray_dir }}"
          when: entry_xray_enabled | bool and not (restore_skip_xray | default(false) | bool)

      always:
        - name: Delete the decrypted backup from the controller
          ansible.builtin.file:
            path: "{{ entry_restore_tmpdir }}"
            state: absent
          delegate_to: localhost
          become: false
          run_once: true
          when: entry_restore_tmpdir is defined
