---
# Move the exit to a new host (same vault identity, so the entry needs no change).
# Inventory: the new host in `exit`, optionally the old one in `exit_old`.
#   ansible-playbook playbooks/swap-exit.yml [-e stop_old=yes]
- name: Check the swap inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Exactly one new exit host, different from the old one
      ansible.builtin.assert:
        that:
          - groups['exit'] | default([]) | length == 1
          - groups['exit'][0] not in groups['exit_old'] | default([])
        fail_msg: "Put exactly one host (the new exit) in the exit group, and only the old one in exit_old"

    - name: The new exit's ansible_host is an IPv4 address
      ansible.builtin.assert:
        that: hostvars[groups['exit'][0]]['ansible_host'] | default('') is match(_ipv4_re)
        fail_msg: >-
          Set ansible_host of {{ groups['exit'][0] }} to its public IPv4 address
          (got '{{ hostvars[groups['exit'][0]]['ansible_host'] | default('') }}'):
          the DNS step and the endpoint check compare against it.
      vars:
        _ipv4_re: '^((25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])$'

- name: Deploy the new exit
  ansible.builtin.import_playbook: exit.yml

- name: Point the exit DNS record at the new exit
  hosts: exit
  gather_facts: false
  vars:
    dns_record: "{{ exit_domain }}"
    dns_ip: "{{ ansible_host | default(inventory_hostname) }}"
  tasks:
    - name: Update DNS
      ansible.builtin.include_role:
        name: dns_update

- name: Flush the entry resolver and stop the old exit (awg)
  hosts: entry
  become: true
  gather_facts: false
  tasks:
    - name: Flush the resolver cache so the entry sees the new exit address
      ansible.builtin.command: resolvectl flush-caches
      changed_when: false
      failed_when: false

# awg mode: the old exit has the same identity and keys and still carries
# traffic, so its handshakes keep pulling the entry's peer endpoint back by
# roaming. It must be down before we wait for the new one.
- name: Stop the old exit before waiting for the new one (awg)
  hosts: exit_old
  become: true
  gather_facts: false
  tasks:
    - name: Stop multihop-exit on the old exit (and keep it stopped across reboots with stop_old)
      community.docker.docker_container:
        name: multihop-exit
        state: stopped
        restart_policy: "{{ 'no' if (stop_old | default(false) | bool) else omit }}"
      when: uplink_transport | default('awg') != 'reality'

# reality mode: the entry's Xray follows the DNS change when restarted (it
# resolves the exit domain at start). Generate traffic, then wait for an
# established connection to the new exit.
#
# awg mode: multihop-reresolve on the entry follows the DNS change within about
# a minute (plus the record's TTL on the entry's resolver). After the endpoint
# flips, the entry keeps its old session keys, which the new exit drops; an
# idle uplink would only rekey after ~2 minutes. So: wait for the flip, then
# send data over awg-uplink (forces a handshake within ~15 s) and require a
# handshake newer than the flip.
- name: Wait for the entry to reach the new exit
  hosts: entry
  become: true
  gather_facts: false
  vars:
    _new_exit_ip: "{{ hostvars[groups['exit'][0]]['ansible_host'] }}"
    _uplink_base: "{{ (uplink_subnet | split('/'))[0].split('.') }}"
  tasks:
    - name: Restart multihop-uplink-xray to pick up the new exit address
      community.docker.docker_container:
        name: multihop-uplink-xray
        state: started
        restart: true
      when: uplink_transport | default('awg') == 'reality'

    - name: Wait up to 5 minutes for an established connection to the new exit
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          docker exec amnezia-awg2 curl -4 -s --max-time 5 "$ECHO_URL" > /dev/null || true
          ss -Htn state established dst "$EXIT_IP" dport = :"$EXIT_PORT" | grep -q .
        executable: /bin/bash
      environment:
        ECHO_URL: "{{ verify_ip_echo_url | default('https://api.ipify.org') }}"
        EXIT_IP: "{{ _new_exit_ip }}"
        EXIT_PORT: "{{ exit_reality_port }}"
      register: swap_exit_reality_conn
      until: swap_exit_reality_conn.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: uplink_transport | default('awg') == 'reality'

    - name: Wait up to 5 minutes until the uplink endpoint is the new exit
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          docker exec multihop-uplink awg show awg-uplink endpoints \
            | awk -v ip="$ENDPOINT" '{ sub(/:[0-9]+$/, "", $2); if ($2 == ip) found = 1 } END { exit !found }'
          date +%s
        executable: /bin/bash
      environment:
        ENDPOINT: "{{ _new_exit_ip }}"
      register: swap_exit_flip
      until: swap_exit_flip.rc == 0
      retries: 30
      delay: 10
      changed_when: false
      when: uplink_transport | default('awg') != 'reality'

    - name: Force and wait for a handshake with the new exit (one rekey interval at most)
      ansible.builtin.include_tasks: tasks/wait-handshake.yml
      vars:
        wait_handshake_endpoint: "{{ _new_exit_ip }}"
        wait_handshake_since: "{{ swap_exit_flip.stdout | trim }}"
        wait_handshake_kick: "{{ _uplink_base[:3] | join('.') }}.{{ (_uplink_base[3] | int) + 1 }}"
        wait_handshake_retries: 20
      when: uplink_transport | default('awg') != 'reality'

- name: Confirm the new exit has a session with the entry
  hosts: exit
  become: true
  gather_facts: false
  tasks:
    - name: Wait for a fresh handshake on awg-exit
      ansible.builtin.include_tasks: tasks/wait-handshake.yml
      vars:
        wait_handshake_container: multihop-exit
        wait_handshake_iface: awg-exit
        wait_handshake_retries: 20
      when: uplink_transport | default('awg') != 'reality'

- name: Verify
  ansible.builtin.import_playbook: verify.yml

- name: Stop the old exit
  hosts: exit_old
  become: true
  gather_facts: false
  tasks:
    - name: Stop multihop-exit and keep it stopped across reboots
      community.docker.docker_container:
        name: multihop-exit
        state: stopped
        restart_policy: "no"
      when: stop_old | default(false) | bool

    - name: Stop multihop-exit-xray and keep it stopped across reboots
      community.docker.docker_container:
        name: multihop-exit-xray
        state: stopped
        restart_policy: "no"
      when:
        - stop_old | default(false) | bool
        - uplink_transport | default('awg') == 'reality'
