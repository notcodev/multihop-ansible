---
# Runs on the entry. Proves user traffic leaves through the exit:
#   1. the uplink handshake is fresh;
#   2. a request from inside amnezia-awg2 raises the exit's tunnel byte counters;
#   3. (verify_compare_ips, default true) the echoed IPv4 is the exit's public
#      IPv4, so facts must have been gathered on the exit (verify.yml does).
# Inputs: verify_ip_echo_url (default https://api.ipify.org),
#         verify_compare_ips, wait_handshake_retries.
- name: Read the public interface's group
  ansible.builtin.shell:
    cmd: set -o pipefail; . /etc/multihop/multihop.env; ip -d link show dev "$PUBLIC_IFACE" | head -n 1
    executable: /bin/bash
  register: verify_public_group
  changed_when: false

# Rule 10120 suppresses this group; without it bridge traffic takes provider
# host routes via the public interface and is dropped (container DNS breaks).
- name: Assert the public interface is in group 51820
  ansible.builtin.assert:
    that: verify_public_group.stdout is search('\\bgroup 51820\\b')
    fail_msg: >-
      The public interface is not in group 51820 ({{ verify_public_group.stdout }}).
      Run `systemctl reload multihop-net` on the entry and check
      /etc/udev/rules.d/90-multihop-public-group.rules.
    quiet: true

# The app container must be ours: AWG up, the NAT rules that keep user UDP off
# the AWG port (the reply exception relies on them), and the image built by
# entry_app (an app reinstall rebuilds amnezia-awg2 from upstream).
- name: Inspect the app container
  ansible.builtin.shell:
    cmd: |
      {% raw %}
      set -o pipefail
      docker exec amnezia-awg2 awg show awg0 > /dev/null && echo awg=up
      echo "to_ports=$(docker exec amnezia-awg2 iptables -t nat -S POSTROUTING | grep -c -- '-p udp .*--to-ports')"
      img=$(docker inspect -f '{{.Image}}' amnezia-awg2)
      echo "label=$(docker image inspect -f '{{index .Config.Labels "org.multihop.build"}}' "$img")"
      {% endraw %}
    executable: /bin/bash
  register: verify_app
  changed_when: false
  failed_when: false

- name: Assert the app container is the one entry_app builds
  ansible.builtin.assert:
    that:
      - "'awg=up' in verify_app.stdout_lines"
      - "'to_ports=2' in verify_app.stdout_lines"
      - verify_app.stdout is search('(?m)^label=[0-9a-f]{64}$')
    fail_msg: >-
      amnezia-awg2 is not the container entry_app builds ({{ verify_app.stdout_lines | join(', ') }}
      {{ verify_app.stderr | default('') | trim }}): expected awg=up, to_ports=2 and an
      org.multihop.build label. If the app reinstalled it, run playbooks/restore.yml.
    quiet: true

- name: Wait for a fresh uplink handshake
  ansible.builtin.import_tasks: wait-handshake.yml
  when: uplink_transport != 'reality'

# Container-originated curl cannot detect a broken client ingress path. The
# public-port mark must precede DNAT, and its reverse lookup must use main.
- name: Verify VPN ingress marking and source validation in reality mode
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      . /etc/multihop/multihop.env
      iptables -t mangle -C PREROUTING -i "$PUBLIC_IFACE" -m addrtype --dst-type LOCAL -j MULTIHOP-INGRESS
      iptables -t mangle -C MULTIHOP-INGRESS -p udp --dport "$ENTRY_AWG_PORT" -j MARK --set-mark 0x5b00/0xff00
      iptables -t mangle -C MULTIHOP-MARK -m mark --mark 0x5a/0xff -j CONNMARK --save-mark --nfmask 0xff --ctmask 0xff
      iptables -t mangle -C MULTIHOP-INGRESS -m conntrack --ctdir REPLY -m connmark --mark 0x5a/0xff -j CONNMARK --restore-mark --nfmask 0xff --ctmask 0xff
      if [ -n "${ENTRY_XRAY_PORT:-}" ]; then
        for proto in tcp udp; do
          iptables -t mangle -C MULTIHOP-INGRESS -p "$proto" --dport "$ENTRY_XRAY_PORT" -j MARK --set-mark 0x5b00/0xff00
        done
      fi
      test "$(sysctl -n net.ipv4.conf.all.src_valid_mark)" = 1
      {% raw %}
      container_ip=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{"\n"}}{{end}}' amnezia-awg2 | head -n 1)
      {% endraw %}
      ip -4 route get "$container_ip" from 1.1.1.1 iif "$PUBLIC_IFACE" mark 0x5b00
    executable: /bin/bash
  changed_when: false
  when: uplink_transport == 'reality'

- name: Inspect the Xray uplink
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      echo "running=$(docker inspect -f '{{ '{{.State.Running}}' }}' multihop-uplink-xray)"
      echo "listeners=$(ss -Hltn sport = :{{ uplink_tproxy_port }} | wc -l)"
    executable: /bin/bash
  register: verify_xray
  changed_when: false
  failed_when: false
  when: uplink_transport == 'reality'

- name: Assert the Xray uplink runs and listens on the TPROXY port
  ansible.builtin.assert:
    that:
      - "'running=true' in verify_xray.stdout_lines"
      - verify_xray.stdout is search('(?m)^listeners=[1-9]')
    fail_msg: >-
      multihop-uplink-xray is not running or nothing listens on TCP {{ uplink_tproxy_port }}
      ({{ verify_xray.stdout_lines | default([]) | join(', ') }} {{ verify_xray.stderr | default('') | trim }}).
    quiet: true
  when: uplink_transport == 'reality'

- name: Check egress through the exit
  vars:
    _verify_exit_host: "{{ groups['exit'][0] }}"
    # Not plain ansible_host: a delegated task may see the delegate's.
    _verify_entry_ip: "{{ hostvars[inventory_hostname].ansible_host }}"
    _verify_exit_bytes_cmd: >-
      set -o pipefail;
      docker exec multihop-exit awg show awg-exit transfer
      | awk '{ s += $2 + $3 } END { print s + 0 }'
  block:
    - name: Read the exit tunnel byte counters (before)
      ansible.builtin.shell:
        cmd: "{{ _verify_exit_bytes_cmd }}"
        executable: /bin/bash
      register: verify_exit_bytes_before
      changed_when: false
      delegate_to: "{{ _verify_exit_host }}"
      when: uplink_transport != 'reality'

    - name: Ask the IP echo service from inside amnezia-awg2
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - amnezia-awg2
          - curl
          - "-4"
          - "-s"
          - --max-time
          - "10"
          - "{{ verify_ip_echo_url | default('https://api.ipify.org') }}"
      register: verify_echo
      changed_when: false

    - name: Read the exit tunnel byte counters (after)
      ansible.builtin.shell:
        cmd: "{{ _verify_exit_bytes_cmd }}"
        executable: /bin/bash
      register: verify_exit_bytes_after
      changed_when: false
      delegate_to: "{{ _verify_exit_host }}"
      when: uplink_transport != 'reality'

    - name: Assert the request went through the exit tunnel
      ansible.builtin.assert:
        that: (verify_exit_bytes_after.stdout | int) > (verify_exit_bytes_before.stdout | int)
        fail_msg: >-
          The exit's awg-exit byte counters did not grow
          ({{ verify_exit_bytes_before.stdout }} -> {{ verify_exit_bytes_after.stdout }})
          while amnezia-awg2 fetched {{ verify_ip_echo_url | default('https://api.ipify.org') }}.
        quiet: true
      when: uplink_transport != 'reality'

    # Each client connection is its own short TCP connection to the exit, so
    # hold one open (slow download) while the exit is inspected.
    - name: Hold a slow download open from inside amnezia-awg2
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - amnezia-awg2
          - curl
          - "-4"
          - "-s"
          - "-o"
          - /dev/null
          - --max-time
          - "30"
          - --limit-rate
          - 20k
          - "{{ verify_slow_download_url | default('https://speed.cloudflare.com/__down?bytes=2000000') }}"
      async: 40
      poll: 0
      register: verify_slow_job
      changed_when: false
      when: uplink_transport == 'reality'

    - name: Look for an established connection from the entry on the exit's REALITY port
      ansible.builtin.shell:
        cmd: ss -Htn state established sport = :{{ exit_reality_port }} dst {{ _verify_entry_ip }}
        executable: /bin/bash
      register: verify_exit_conn
      changed_when: false
      delegate_to: "{{ _verify_exit_host }}"
      until: verify_exit_conn.stdout | trim | length > 0
      retries: 5
      delay: 3
      when: uplink_transport == 'reality'

    - name: Assert the exit has a REALITY connection from the entry
      ansible.builtin.assert:
        that: verify_exit_conn.stdout | trim | length > 0
        fail_msg: >-
          No established TCP connection from the entry ({{ _verify_entry_ip }}) to
          port {{ exit_reality_port }} on the exit: the request did not travel over REALITY.
        quiet: true
      when: uplink_transport == 'reality'

    - name: Ask the IP echo service from inside amnezia-xray
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - amnezia-xray
          - curl
          - "-4"
          - "-s"
          - --max-time
          - "10"
          - "{{ verify_ip_echo_url | default('https://api.ipify.org') }}"
      register: verify_echo_xray
      changed_when: false
      when:
        - uplink_transport == 'reality'
        - entry_xray_enabled | bool

    - name: Assert amnezia-xray egresses with the exit's public IPv4
      ansible.builtin.assert:
        that: verify_echo_xray.stdout | trim == hostvars[_verify_exit_host].ansible_default_ipv4.address
        fail_msg: >-
          amnezia-xray egresses as '{{ verify_echo_xray.stdout | trim }}', expected the exit's
          public IPv4 '{{ hostvars[_verify_exit_host].ansible_default_ipv4.address | default('unknown') }}'.
        quiet: true
      when:
        - uplink_transport == 'reality'
        - entry_xray_enabled | bool
        - verify_compare_ips | default(true) | bool

    - name: Assert the entry egresses with the exit's public IPv4
      ansible.builtin.assert:
        that:
          - hostvars[_verify_exit_host].ansible_default_ipv4.address is defined
          - verify_echo.stdout | trim == hostvars[_verify_exit_host].ansible_default_ipv4.address
        fail_msg: >-
          amnezia-awg2 egresses as '{{ verify_echo.stdout | trim }}', expected the exit's
          public IPv4 '{{ hostvars[_verify_exit_host].ansible_default_ipv4.address | default('unknown: gather facts on exit') }}'.
          Set verify_compare_ips=false if the exit's public address is not on its default interface (NAT).
        quiet: true
      when: verify_compare_ips | default(true) | bool
