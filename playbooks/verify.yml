---
# Verify the two-hop path from the entry.
#   ansible-playbook playbooks/verify.yml
#   ansible-playbook playbooks/verify.yml -e verify_fail_closed=true   # also the fail-closed test
#   ansible-playbook playbooks/verify.yml --tags fail_closed           # only the fail-closed test
- name: Gather exit facts (its public IPv4 is the expected egress address)
  hosts: exit
  gather_facts: true
  tasks: []

- name: Verify the entry egresses through the exit
  hosts: entry
  become: true
  gather_facts: false
  tasks:
    - name: Verify the uplink path
      ansible.builtin.import_tasks: tasks/verify-entry.yml

    # Stops the uplink, so users lose connectivity for about a minute.
    - name: Fail-closed test (traffic is dropped while the uplink is down)
      when: (verify_fail_closed | default(false) | bool) or ('fail_closed' in ansible_run_tags)
      tags: [fail_closed]
      vars:
        _fc_container: "{{ 'multihop-uplink-xray' if uplink_transport | default('awg') == 'reality' else 'multihop-uplink' }}"
        _fc_url: "{{ verify_ip_echo_url | default('https://api.ipify.org') }}"
        _fc_host: "{{ _fc_url | urlsplit('hostname') }}"
        _fc_port: "{{ _fc_url | urlsplit('port') | default(443 if (_fc_url | urlsplit('scheme')) == 'https' else 80, true) }}"
      block:
        # Resolve while the uplink is up, so the down check tests TCP egress
        # (curl --resolve) instead of passing on a DNS failure.
        - name: Resolve the IP echo host while the uplink is up
          ansible.builtin.shell:
            cmd: set -o pipefail; getent ahostsv4 {{ _fc_host | quote }} | awk 'NR == 1 { print $1 }'
            executable: /bin/bash
          register: verify_fail_closed_ip
          changed_when: false
          failed_when: verify_fail_closed_ip.rc != 0 or verify_fail_closed_ip.stdout | trim | length == 0

        - name: Stop the uplink container
          community.docker.docker_container:
            name: "{{ _fc_container }}"
            state: stopped

        - name: Ask the IP echo service from inside amnezia-awg2 (must fail)
          ansible.builtin.command:
            argv:
              - docker
              - exec
              - amnezia-awg2
              - curl
              - "-4"
              - "-s"
              - --max-time
              - "10"
              - --resolve
              - "{{ _fc_host }}:{{ _fc_port }}:{{ verify_fail_closed_ip.stdout | trim }}"
              - "{{ _fc_url }}"
          register: verify_fail_closed_echo
          changed_when: false
          failed_when: false

        - name: Assert no traffic left while the uplink was down
          ansible.builtin.assert:
            that: verify_fail_closed_echo.rc != 0
            fail_msg: >-
              LEAK: with {{ _fc_container }} stopped, amnezia-awg2 still reached the internet
              as '{{ verify_fail_closed_echo.stdout | trim }}'. The fail-closed rules are broken.
            quiet: true

      always:
        - name: Start the uplink container again
          community.docker.docker_container:
            name: "{{ _fc_container }}"
            state: started

        - name: Wait for the uplink to handshake again
          ansible.builtin.include_tasks: tasks/wait-handshake.yml
          when: uplink_transport | default('awg') != 'reality'

        - name: Wait for the TPROXY listener again
          ansible.builtin.command: ss -Hltn sport = :{{ uplink_tproxy_port }}
          register: verify_fc_listen
          until: verify_fc_listen.stdout | trim | length > 0
          retries: 12
          delay: 5
          changed_when: false
          when: uplink_transport | default('awg') == 'reality'
