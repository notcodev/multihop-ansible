---
# Cloud lab used by tests/integration/run.sh (throwaway x86_64 Ubuntu hosts).
# `run.sh init` copies this file to inventories/lab/group_vars/all/vars.yml
# (the whole inventories/lab/ is gitignored) and generates the rest from
# tests/integration/.state/lab.env: hosts.yml (IPs, SSH), group_vars/all/lab.yml
# (AWG ports, S3 location, age recipient) and the encrypted vault.yml,
# vault_uplink.yml and vault_s3.yml (password in tests/integration/.state/vault-pass).

# domains: fake names, resolved through /etc/hosts on the entry (hostsfile backend)
entry_domain: entry.multihop.test
exit_domain: exit.multihop.test
dns_backend: hostsfile
# the test VPN client resolves entry_domain too (it connects by name)
dns_hostsfile_hosts: "{{ (groups['entry'] | default([])) + (groups['lab_client'] | default([])) }}"
ssh_port: 22

# addressing and image
entry_awg_subnet: 10.8.1.0/24
uplink_subnet: 10.9.0.0/30
uplink_mtu: 1280
awg_base_image_digest: sha256:cbafc02b8373a83f428272db6d8001b37bc02e6211cbd8c0cb4e2e3759b12b72
# ghcr.io/xtls/xray-core release 26.10.31 (same pin as the example inventory)
xray_image_digest: sha256:ceabeac03a89d991d2a247361825c1d1d2e9c91cd5dc010f298c7dc0c2f325c9

# Xray-only uplink and the app's Xray on the entry. `run.sh check rollback_to_awg`
# switches to awg (-e uplink_transport=awg) and back.
uplink_transport: reality
entry_xray_enabled: true
# A stock Xray client user added "the way the app does" (lab.yml --tags xray);
# throwaway lab, so a fixed id is fine.
lab_xray_client_uuid: 7c1e0b7e-5b52-4a5b-9d3a-1f2f6a0d9e11

# split routing: one direct domain, no country list
split_routing_enabled: true
split_direct_countries: []
split_country_list_url: "https://www.ipdeny.com/ipblocks/data/aggregated/{cc}-aggregated.zone"
# 1.0.0.0/24 is direct (cdn-cgi/trace at 1.0.0.1 shows the entry IP); 1.1.1.1/32 inside
# 1.1.1.0/24 is forced through the exit although the range is direct.
split_direct_cidrs: [1.0.0.0/24, 1.1.1.0/24]
split_direct_domains: [ifconfig.me]
split_force_exit_cidrs: [1.1.1.1/32]

# backups: the owner's real S3 bucket. Endpoint, region, bucket and prefix are
# written to lab.yml from tests/integration/.state/s3.env, the keys to vault_s3.yml.
backup_interval: 15min

# entry and exit have their own public IPs here
verify_compare_ips: true
