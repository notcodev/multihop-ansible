---
- name: Render templates for tests
  hosts: localhost
  connection: local
  gather_facts: false
  # Role defaults first (as in a real play), then fixture values on top.
  vars_files:
    - ../../roles/multihop_defaults/defaults/main.yml
    - ../../roles/common/defaults/main.yml
    - fixture_vars.yml
  tasks:
    - name: Create output dir
      ansible.builtin.file:
        path: "{{ playbook_dir }}/out"
        state: directory
        mode: "0755"

    - name: Render each template
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ playbook_dir }}/out/{{ item.dest }}"
        mode: "0644"
      loop: "{{ render_list }}"
